name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pharmarag-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: pip check

      - name: Compile Python
        run: python -m compileall app.py rag_pipeline.py tests

      - name: Run unit tests
        run: pytest -q

      - name: Run smoke checks
        run: |
          mkdir -p \
            data/input/sample_docs \
            data/uploads \
            data/runtime/vector_store
          bash scripts/smoke_test.sh
